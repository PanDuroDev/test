[package]
name = "rasm-engine-storage"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Versioned local project container and validated document codec for Rasm Studio"

[dependencies]
crc32fast.workspace = true
rasm-engine-document = { path = "../engine-document" }
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
glam.workspace = true
rasm-engine-ink = { path = "../engine-ink" }
tempfile = "3.20"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Storage_FileSystem"] }
