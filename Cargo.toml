[workspace]
resolver = "2"
members = [
    "crates/engine-core",
    "crates/engine-document",
    "crates/engine-storage",
    "crates/engine-ink",
    "crates/engine-tiles",
    "crates/engine-ffi",
    "crates/renderer-tileink",
    "tools/uniffi-bindgen",
    "apps/desktop-prototype",
]

[workspace.package]
version = "0.2.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.87"

[workspace.dependencies]
glam = { version = "0.34.1", default-features = false, features = ["std", "float-types"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
crc32fast = "1.4"
kurbo = "0.13.1"
peniko = "0.6.1"
tileink = "=0.1.2"
